# Local Neo4j for development. Start with:  docker compose up -d
# Browser UI: http://localhost:7474   Bolt: bolt://localhost:7687
services:
  neo4j:
    image: neo4j:5.26
    container_name: bd-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt driver
    environment:
      # Must match NEO4J_USER / NEO4J_PASSWORD in your .env file.
      NEO4J_AUTH: neo4j/password
      # Raise memory a bit so seeding ~100k ratings stays fast.
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
